<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <!-- The app translates itself (ngx-translate); stop the browser's own translation from re-translating Arabic to English. -->
    <meta name="google" content="notranslate" />
    <!-- Images may only come from this app (its own files), from blob: (profile photos, fetched with the sign-in) and from
         data:. A profile photo address that points at another site is never loaded, so no other host learns who opens a
         profile. Only img-src is restricted here; everything else keeps the browser's default. -->
    <meta http-equiv="Content-Security-Policy" content="img-src 'self' blob: data:" />
    <title>Ehrms</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- The fonts are bundled in /fonts (see src/fonts.css): the app never calls Google, so it looks the same on a
         slow, offline or filtered network. Preloaded because the first screen needs all three: without them the
         icons would flash as words like "edit". -->
    <link rel="preload" href="fonts/material-icons.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="fonts/plus-jakarta-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/noto-sans-arabic-arabic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
