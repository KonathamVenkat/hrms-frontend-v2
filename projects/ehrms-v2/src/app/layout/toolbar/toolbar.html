<header class="topbar">
  <div class="topbar-brand">
    <!-- Desktop: expand / collapse the rail. Mobile: open the drawer. -->
    <button
      class="icon-btn nav-toggle"
      type="button"
      [attr.aria-label]="'layout.toolbar.collapseMenu' | translate"
      (click)="navToggle.emit()"
    >
      <span class="material-icons" aria-hidden="true">menu</span>
    </button>
    <button
      class="icon-btn drawer-toggle"
      type="button"
      [attr.aria-label]="'layout.toolbar.toggleMenu' | translate"
      (click)="drawerToggle.emit()"
    >
      <span class="material-icons" aria-hidden="true">menu</span>
    </button>
    <span class="brand-name">EHRMS</span>
  </div>

  <!-- Actions -->
  <div class="topbar-actions">
    <!-- Clock (current time) -->
    <div class="clock-badge" [title]="'layout.toolbar.currentTime' | translate">
      <span class="material-icons clock-icon" aria-hidden="true">schedule</span>
      <span class="clock-time">{{ currentTime() }}</span>
    </div>

    <!-- Dark mode: disabled for now. Uncomment this button to bring the toggle back (the theme tokens and
         toggleDarkMode() in toolbar.ts are still in place).
    <button
      class="icon-btn"
      type="button"
      [attr.aria-label]="'layout.toolbar.toggleDarkMode' | translate"
      [attr.aria-pressed]="isDarkMode()"
      [title]="'layout.toolbar.toggleDarkMode' | translate"
      (click)="toggleDarkMode()"
    >
      <span class="material-icons" aria-hidden="true">{{ isDarkMode() ? 'light_mode' : 'dark_mode' }}</span>
    </button>
    -->

    <!-- Language -->
    <app-language-switcher />

    <!-- Profile -->
    <div class="profile-wrap">
      <button
        class="profile-trigger"
        type="button"
        aria-haspopup="menu"
        aria-controls="profile-menu"
        (click)="toggleProfile($event)"
        [attr.aria-expanded]="profileOpen()"
      >
        <div class="avatar" aria-hidden="true">
          <app-user-avatar [photoUrl]="photoUrl()" [name]="user()?.fullName || ('layout.toolbar.userFallback' | translate)" />
        </div>
        <div class="profile-info">
          <span class="profile-name">{{
            user()?.fullName || ('layout.toolbar.userFallback' | translate)
          }}</span>
          <span class="profile-status" [class.online]="isOnline()" [class.offline]="!isOnline()">
            <span class="status-dot" aria-hidden="true"></span
            >{{
              (isOnline() ? 'layout.toolbar.onlineStatus' : 'layout.toolbar.offlineStatus')
                | translate
            }}
          </span>
        </div>
        <span class="material-icons chevron" aria-hidden="true" [class.rotated]="profileOpen()">expand_more</span>
      </button>

      @if (profileOpen()) {
        <div
          id="profile-menu"
          class="profile-dropdown"
          role="menu"
          [attr.aria-label]="'layout.toolbar.userMenu' | translate"
          [style.top.px]="dropdownTop()"
          [style.right.px]="direction() === 'rtl' ? null : dropdownRight()"
          [style.left.px]="direction() === 'rtl' ? dropdownLeft() : null"
        >
          <button class="dropdown-item" type="button" role="menuitem" (click)="openProfile()">
            <span class="material-icons" aria-hidden="true">person</span
            >{{ 'layout.toolbar.myProfile' | translate }}
          </button>
          <button class="dropdown-item" type="button" role="menuitem" (click)="changePassword()">
            <span class="material-icons" aria-hidden="true">lock</span
            >{{ 'layout.toolbar.changePassword' | translate }}
          </button>
          <div class="dropdown-divider" role="separator"></div>
          <button class="dropdown-item logout" type="button" role="menuitem" (click)="logout()">
            <span class="material-icons" aria-hidden="true">power_settings_new</span
            >{{ 'layout.toolbar.logout' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
